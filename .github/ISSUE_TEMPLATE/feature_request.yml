name: Feature / Skill Proposal
description: Suggest an idea, new agent skill, workflow, or platform adapter
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new capability for HolyShitItWorks. Please align proposals with our core design principles: portable-first, risk-proportional overhead, and zero runtime daemons.
  - type: input
    id: title
    attributes:
      label: Proposal Title
      placeholder: e.g. New Skill: database-migration-safety
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Component Category
      options:
        - "Agent Skill (skills/)"
        - "Workflow (workflows/)"
        - "Platform Integration / Native Manifest"
        - "Template (templates/)"
        - "Validator / Script (scripts/)"
        - "Documentation"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What engineering friction or problem does this proposal address?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Interface
      description: Describe the proposed skill frontmatter, workflow steps, or adapter integration.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider and why were they rejected?
