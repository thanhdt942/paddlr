name: Bug Report
description: Create a report to help us reproduce and fix an issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in HolyShitItWorks!
  - type: input
    id: environment
    attributes:
      label: AI Coding Platform & Environment
      description: What AI coding agent and OS are you using? (e.g. Antigravity on Windows, Claude Code on macOS, Gemini CLI on Linux)
      placeholder: e.g. Claude Code v0.2.29 on macOS Sonoma
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps or prompt sequence to reproduce the behavior.
      placeholder: |
        1. Run 'python scripts/scan_repo.py'
        2. Prompt agent with '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Command Output / Evidence
      description: Paste any command output, terminal error logs, or verification reports.
      render: shell
