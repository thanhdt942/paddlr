<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Oceanic Slate -->
    <linearGradient id="pdl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#032535"/>
    </linearGradient>

    <!-- Water & Duck Body Gradient -->
    <linearGradient id="pdl-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Surface Ripple Gradient -->
    <linearGradient id="pdl-ripple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Beak Accent -->
    <linearGradient id="pdl-beak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="pdl-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container (Developer Tool App Icon Style) -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#pdl-bg)" stroke="url(#pdl-accent)" stroke-width="6" filter="url(#pdl-shadow)"/>

  <!-- Water Surface Dividing Line (Above vs Below Surface) -->
  <path d="M 88 280 Q 172 268 256 280 T 424 280" fill="none" stroke="url(#pdl-ripple)" stroke-width="4" stroke-linecap="round"/>

  <!-- Subsurface Kinetic Ripples & Engineering Waves (Below the Surface) -->
  <path d="M 120 316 Q 188 304 256 316 T 392 316" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,6" opacity="0.6"/>
  <path d="M 152 352 Q 204 342 256 352 T 360 352" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6,6" opacity="0.45"/>
  <path d="M 192 388 Q 224 380 256 388 T 320 388" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,6" opacity="0.3"/>

  <!-- The Duck Mascot (Above the Surface: Serene, Geometric, Modern) -->
  <!-- Duck Body -->
  <path d="M 152 278 C 148 240 180 204 228 204 C 248 204 266 212 280 226 L 314 186 C 322 176 336 172 348 178 C 360 184 366 198 362 210 L 348 252 C 362 260 368 270 368 278 Z"
        fill="url(#pdl-accent)"/>

  <!-- Duck Wing Feather Contour (Precision Geometry) -->
  <path d="M 204 274 C 200 248 220 230 252 230 C 274 230 292 242 304 260 C 272 264 236 270 204 274 Z"
        fill="#082f49" opacity="0.45"/>

  <!-- Duck Head & Eye -->
  <circle cx="340" cy="190" r="28" fill="url(#pdl-accent)"/>
  <circle cx="348" cy="186" r="4.5" fill="#0f172a"/>
  <circle cx="350" cy="184" r="1.5" fill="#ffffff"/>

  <!-- Duck Beak (Friendly & Practical) -->
  <path d="M 364 184 L 404 192 C 408 193 408 199 404 200 L 364 204 Z" fill="url(#pdl-beak)"/>

  <!-- Paddle Propulsion Indicator (Under-the-surface motion) -->
  <ellipse cx="236" cy="330" rx="18" ry="8" transform="rotate(-25 236 330)" fill="#38bdf8" opacity="0.25"/>
  <ellipse cx="276" cy="342" rx="18" ry="8" transform="rotate(20 276 342)" fill="#34d399" opacity="0.25"/>
</svg>
